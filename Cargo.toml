[package]
name = "dirscope"
version = "1.0.0"
edition = "2024"
description = "Fast disk usage explorer: scan folders recursively, find what's big, delete it."
license = "MIT"
repository = "https://github.com/rft0/dirscope"
readme = "README.md"
keywords = ["disk-usage", "treesize", "gpui", "filesystem"]
categories = ["filesystem", "gui"]

[dependencies]
gpui = "0.2.2"
rayon = "1.12.0"
trash = "5.4.0"

[dev-dependencies]
# Only for `cargo run --example make_icon`, which regenerates the icon files.
resvg = "0.45"

[build-dependencies]
embed-resource = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

# gpui -> zed-async-tar pulls in xattr 0.2.3, which doesn't compile on Linux
# against current libc (ENOATTR was removed). patches/xattr is 0.2.3 with a
# one-line fix; drop this once gpui moves to xattr 1.x.
[patch.crates-io]
xattr = { path = "patches/xattr" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
